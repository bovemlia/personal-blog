<style>
  .subscribe-form {
    box-sizing: border-box;
    max-width: 34rem;
    margin-top: 1.5rem;
  }

  .subscribe-form label {
    display: block;
    margin-bottom: 0.4rem;
  }

  .subscribe-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .subscribe-fields input,
  .subscribe-fields button {
    box-sizing: border-box;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--text-color);
    border-radius: 4px;
    background: var(--background-color);
    color: var(--text-color);
    font: inherit;
  }

  .subscribe-fields input {
    flex: 1 1 14rem;
    min-width: 0;
    width: 100%;
  }

  .subscribe-fields button {
    font-weight: bold;
  }

  .subscribe-fields :focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 3px;
  }

  .site-footer {
    text-align: left;
    border-top: 1px solid #ddd;
    margin-top: 4rem;
    padding-top: 1.25rem;
    font-size: 0.85em;
    color: #777;
  }

  .site-footer p {
    margin: 0 0 0.5rem;
    font-size: 0.75em;
    font-weight: normal;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .site-footer ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .site-footer li {
    margin: 0.25rem 0;
  }

  .site-footer a {
    color: var(--link-color);
    text-decoration: underline;
  }

  @media (prefers-color-scheme: dark) {
    .site-footer {
      border-top-color: #2d4a54;
      color: #9bb0b8;
    }
  }
</style>
{{ if .Params.compactCodeBlocks }}
<style>
  content p:has(+ .highlight) {
    margin-bottom: 0;
  }

  content p + .highlight,
  content .highlight pre {
    margin-top: 0;
  }
</style>
{{ end }}
